apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: {{ .Release.Namespace }}
  labels:
    app: mongodb
    project: roboshop

spec:
  serviceName: mongodb-headless
  replicas: 2

  selector:
    matchLabels:
      app: mongodb
      project: roboshop

  template:
    metadata:
      labels:
        app: mongodb
        project: roboshop

    spec:
      serviceAccountName: mongodb-sa

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: mongodb
                topologyKey: kubernetes.io/hostname

      initContainers:
        - name: fix-keyfile-permissions
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              cp /keyfile-source/MONGO_REPLICA_SET_KEY /keyfile/keyfile
              chown 999:999 /keyfile/keyfile
              chmod 400 /keyfile/keyfile

          volumeMounts:
            - name: mongodb-secret-volume
              mountPath: /keyfile-source
              readOnly: true

            - name: mongodb-keyfile
              mountPath: /keyfile

      containers:
        - name: mongodb
          image: mongo:7.0
          imagePullPolicy: IfNotPresent

          command:
            - docker-entrypoint.sh

          args:
            - mongod
            - "--bind_ip_all"
            - "--replSet"
            - "rs0"
            - "--auth"
            - "--keyFile"
            - "/etc/mongodb-keyfile/keyfile"

          ports:
            - name: mongodb
              containerPort: 27017

          startupProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 5
            failureThreshold: 60

          readinessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 10
            failureThreshold: 3

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_USERNAME

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_PASSWORD

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi

          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

            - name: mongodb-keyfile
              mountPath: /etc/mongodb-keyfile
              readOnly: true

      volumes:
        - name: mongodb-secret-volume
          secret:
            secretName: mongodb-secret
            defaultMode: 0400

        - name: mongodb-keyfile
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: gp3

        resources:
          requests:
            storage: 5Gi
