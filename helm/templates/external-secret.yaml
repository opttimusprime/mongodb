apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mongodb-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: mongodb-secret
    creationPolicy: Owner

  data:
    - secretKey: MONGO_INITDB_ROOT_USERNAME
      remoteRef:
        key: roboshop/dev/mongodb
        property: MONGO_INITDB_ROOT_USERNAME

    - secretKey: MONGO_INITDB_ROOT_PASSWORD
      remoteRef:
        key: roboshop/dev/mongodb
        property: MONGO_INITDB_ROOT_PASSWORD

    - secretKey: MONGO_REPLICA_SET_KEY
      remoteRef:
        key: roboshop/dev/mongodb
        property: MONGO_REPLICA_SET_KEY